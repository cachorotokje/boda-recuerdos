<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuerdos de Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fondo de collage personalizado apuntando a la carpeta static */
        .wedding-collage-bg {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                url('/static/fondo_boda.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="wedding-collage-bg min-h-screen flex flex-col items-center justify-center p-4 relative">
    
    <!-- Contenedor Principal (Tarjeta Flotante Blanca) -->
    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/20 relative z-10">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">¡Comparte tus recuerdos!</h1>
            <p class="text-slate-500 text-sm mt-1">Sube tus fotos y videos de la boda</p>
        </div>
        
        <form id="uploadForm" action="/" method="POST" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" name="accion" id="accionInput" value="existente">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tu Nombre o Familia:</label>
                <input type="text" id="nombreInput" name="nombre" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-pink-500 focus:outline-none transition bg-white"
                    placeholder="Ej. Familia Pérez">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Selecciona tus fotos y videos:</label>
                <input type="file" name="archivos" multiple accept="image/*,video/*" required
                    class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 transition">
            </div>
            
            <button type="submit" 
                class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-pink-600/20">
                Subir Recuerdos
            </button>
        </form>
    </div>

    <!-- Modal de Confirmación si el nombre ya existe -->
    <div id="modalConfirmacion" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100">
            <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                📁
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">¡Ya has subido archivos!</h3>
            <p class="text-slate-600 text-sm mb-6" id="modalTexto">Detectamos que ya existe una carpeta con este nombre. ¿Deseas agregar tus nuevas fotos a tu carpeta existente?</p>
            
            <div class="space-y-2">
                <button id="btnSi" type="button" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-2.5 rounded-xl transition text-sm">
                    Sí, agregar a mi carpeta
                </button>
                <button id="btnNo" type="button" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition text-sm">
                    No, crear una carpeta nueva
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const nombreInput = document.getElementById('nombreInput');
        const accionInput = document.getElementById('accionInput');
        const modal = document.getElementById('modalConfirmacion');
        const btnSi = document.getElementById('btnSi');
        const btnNo = document.getElementById('btnNo');

        let formularioValidado = false;

        form.addEventListener('submit', async function(e) {
            if (formularioValidado) return;

            e.preventDefault();
            const nombre = nombreInput.value.trim();
            if (!nombre) return;

            try {
                const response = await fetch(`/api/verificar-nombre?nombre=${encodeURIComponent(nombre)}`);
                const data = await response.json();

                if (data.existe) {
                    modal.classList.remove('hidden');
                } else {
                    accionInput.value = 'existente';
                    formularioValidado = true;
                    form.submit();
                }
            } catch (error) {
                console.error("Error verificando nombre:", error);
                form.submit();
            }
        });

        btnSi.addEventListener('click', function() {
            accionInput.value = 'existente';
            modal.classList.add('hidden');
            formularioValidado = true;
            form.submit();
        });

        btnNo.addEventListener('click', function() {
            accionInput.value = 'nuevo';
            modal.classList.add('hidden');
            formularioValidado = true;
            form.submit();
        });
    </script>
</body>
</html>
