<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuerdos de Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">¡Comparte tus recuerdos!</h1>
            <p class="text-slate-500 text-sm mt-1">Sube tus fotos y videos de la boda</p>
        </div>
        
        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tu Nombre o Familia:</label>
                <input type="text" name="nombre" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-pink-500 focus:outline-none transition"
                    placeholder="Ej. Familia Pérez">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Selecciona tus fotos y videos:</label>
                <input type="file" name="archivos" multiple accept="image/*,video/*" required
                    class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 transition">
            </div>
            
            <button type="submit" 
                class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-pink-600/20">
                Subir Recuerdos
            </button>
        </form>
    </div>
</body>
</html>
