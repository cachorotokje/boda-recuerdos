<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuerdos de Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fondo fijado a la pantalla de forma segura para celulares */
        .fondo-boda {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/static/fondo_boda.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        /* Capa oscura para que el texto y el cuadro resalten */
        .capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Fondos -->
    <div class="fondo-boda"></div>
    <div class="capa-oscura"></div>

    <!-- Contenedor Principal (Tarjeta Semi-transparente) -->
    <div class="w-full max-w-md bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-6 md:p-8 border border-white/40 relative z-10">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">¡Comparte tus recuerdos!</h1>
            <p class="text-slate-600 text-sm mt-1 font-medium">Sube tus fotos y videos de la boda</p>
        </div>
        
        <form id="uploadForm" action="/" method="POST" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" name="accion" id="accionInput" value="existente">

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Tu Nombre o Familia:</label>
                <input type="text" id="nombreInput" name="nombre" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 focus:outline-none transition bg-white/95"
                    placeholder="Ej. Familia Pérez">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Selecciona tus fotos y videos:</label>
                <input type="file" name="archivos" multiple accept="image/*,video/*" required
                    class="w-full text-sm text-slate-600 bg-white/95 rounded-xl border border-slate-300 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 transition cursor-pointer">
            </div>
            
            <button type="submit" 
                class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-pink-600/30 mt-2">
                Subir Recuerdos
            </button>
        </form>
    </div>

    <!-- Modal de Confirmación -->
    <div id="modalConfirmacion" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100">
            <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                📁
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">¡Ya has subido archivos!</h3>
            <p class="text-slate-600 text-sm mb-6">Detectamos que ya existe una carpeta con este nombre. ¿Deseas agregar tus nuevas fotos a tu carpeta existente?</p>
            
            <div class="space-y-2">
                <button id="btnSi" type="button" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                    Sí, agregar a mi carpeta
                </button>
                <button id="btnNo" type="button" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition">
                    No, crear una carpeta nueva
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const nombreInput = document.getElementById('nombreInput');
        const accionInput = document.getElementById('accionInput');
        const modal = document.getElementById('modalConfirmacion');
        const btnSi = document.getElementById('btnSi');
        const btnNo = document.getElementById('btnNo');

        let formularioValidado = false;

        form.addEventListener('submit', async function(e) {
            if (formularioValidado) return;

            e.preventDefault();
            const nombre = nombreInput.value.trim();
            if (!nombre) return;

            try {
                const response = await fetch(`/api/verificar-nombre?nombre=${encodeURIComponent(nombre)}`);
                const data = await response.json();

                if (data.existe) {
                    modal.classList.remove('hidden');
                } else {
                    accionInput.value = 'existente';
                    formularioValidado = true;
                    form.submit();
                }
            } catch (error) {
                form.submit();
            }
        });

        btnSi.addEventListener('click', function() {
            accionInput.value = 'existente';
            modal.classList.add('hidden');
            formularioValidado = true;
            form.submit();
        });

        btnNo.addEventListener('click', function() {
            accionInput.value = 'nuevo';
            modal.classList.add('hidden');
            formularioValidado = true;
            form.submit();
        });
    </script>
</body>
</html>
